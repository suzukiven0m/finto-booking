# Config unica per ruff e isort: due default diversi sullo stesso file
# producevano due verdetti diversi. `app` e' il package locale del backend.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic", "psycopg", "pytest", "sqlalchemy"]

# gli script in data/ girano col venv del backend e importano `app`
# (PYTHONPATH=backend, vedi il playbook): senza questa sezione ogni editor
# segna quattro import rotti per file.
[tool.pyright]
# basic = il default che pyright usa quando non trova un config: senza questo
# il solo fatto di avere la sezione qui alza il livello e riempie gli script
# pandas di errori sugli stub.
typeCheckingMode = "basic"
venvPath = "backend"
venv = ".venv"
extraPaths = ["backend", "data"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
known_third_party = ["alembic", "psycopg", "pytest", "sqlalchemy"]
