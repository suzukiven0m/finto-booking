---
openapi: 3.0.3
info:
  title: Buby Travel API
  version: 1.0.0
  description: |
    Canonical API contract v1 for the Buby Travel dashboard, search and
    guest-request assistant. Frozen at SAL 1 (2026-11-20).

    Sources of truth: `docs/data-dictionary.md` (KPI rules + clean baseline),
    `docs/erd.md` (5-table schema), `docs/adr/0001-tech-stack.md` (stack, JWT
    roles), `docs/adr/0003-data-sources.md` (data sources),
    `docs/delivery-plan.md`.

    **Disclosures (binding, must also appear in the UI):**
    - The two properties are **fictional**: a 1:1 map of the two hotel types in
      the Kaggle Hotel Booking Demand CSV (Buby Lago ← Resort Hotel,
      Buby Montagna ← City Hotel). No real Buby data exists.
    - Occupancy and RevPAR are computed against **assumed capacity**
      (Buby Lago 190 rooms, Buby Montagna 230 rooms), inferred from observed
      peaks — never measured. They must never be presented as measured.
    - The reviews ↔ bookings link is **asserted at property level**, not
      factual (a 2012 TripAdvisor reviewer is not the guest of a 2016 booking).
      Occupancy/revenue KPIs come only from bookings; reputation KPIs come
      only from reviews.
    - `guest_requests` emails are **synthetic** (generator DA-3), not real
      guest correspondence.

    Authentication: JWT bearer with roles `admin`, `manager`,
    `property_manager` (ADR 0001). Only the scheme is frozen here; real JWT
    issuance and role enforcement land with D11. `/api/properties` and
    `/api/auth/login` are unauthenticated for the demo.

    Conventions: list endpoints paginate with `page`/`page_size` and return
    `{ data: [...], meta: { page, page_size, total, total_pages } }`. Every
    4xx/5xx response uses the error envelope `{ error: { code, message,
    details? } }`.
servers:
  - url: http://localhost:8000
    description: Real FastAPI backend (D12)
  - url: http://localhost:4010
    description: Prism mock server generated from this spec (D6)
security:
  - bearerAuth: []
tags:
  - name: properties
    description: The two fictional Buby properties.
  - name: kpis
    description: Occupancy/revenue KPIs, computed only from cleaned bookings.
  - name: reviews
    description: >-
      Reputation KPIs and raw TripAdvisor reviews (asserted
      property-level link).
  - name: bookings
    description: Booking search/filter (D19).
  - name: guest-requests
    description: >-
      Synthetic guest-email inbox with human-in-the-loop assistant
      (D20).
  - name: auth
    description: JWT login. Scheme frozen at SAL 1; implementation is D11.
paths:
  /api/properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List the two Buby properties
      description: |
        Returns exactly two properties. They are fictional: a 1:1 map of the
        CSV's two hotel types (Resort Hotel → Buby Lago, City Hotel →
        Buby Montagna). `room_count` is assumed capacity, not measured.
        Unauthenticated for the demo.
      security: []
      responses:
        "200":
          description: The two properties.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyList"
              example:
                data:
                  - id: 1
                    name: Buby Lago
                    hotel_type: Resort Hotel
                    location_type: lake
                    room_count: 190
                    ta_hotel_id: 93618
                  - id: 2
                    name: Buby Montagna
                    hotel_type: City Hotel
                    location_type: mountain
                    room_count: 230
                    ta_hotel_id: 2079052
  /api/kpis/summary:
    get:
      operationId: getKpiSummary
      tags: [kpis]
      summary: Headline KPIs for a property (or both) and a date range
      description: |
        KPI rules are binding (`docs/data-dictionary.md` §3): revenue =
        adr × nights over `is_canceled=0 AND nights>0 AND adr>0` after exact
        dedup on the original CSV columns; cancellation_rate =
        canceled / total post-dedup (No-Show reported separately);
        adr = revenue / room_nights; occupancy_avg =
        Σroom_nights / (Σroom_count × days-in-window) — pooled, NOT the mean
        of daily occupancy ratios — where days-in-window is the number of
        distinct dates in the requested window (793 for the default full
        window) and Σroom_count is 190 or 230 per property, 420 for both;
        revpar = revenue / room_count / available-days. Occupancy and RevPAR
        use **assumed capacity** (190 / 230 rooms), never measured.
        Window semantics: the summary is an **arrival cohort** — it filters
        `bookings.arrival_date` within [date_from, date_to] (inclusive), so
        a stay arriving inside the window contributes all its nights, even
        those spilling past date_to. The daily series (`getKpiDaily`) counts
        stay days on `kpi_daily.date` instead: summary and daily totals
        differ at range edges **by design** (default window: 19 stay-days
        past 2017-08-31, €105,263.50, are in the summary but outside the
        daily window).
        The example is the full-dataset clean baseline the seed script must
        reproduce.
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: KPI summary matching the pinned rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/kpis/daily:
    get:
      operationId: getKpiDaily
      tags: [kpis]
      summary: Daily KPI series (paginated)
      description: |
        Stay-day series: one point per day from `kpi_daily.date`, computed
        from non-canceled bookings. `date_from`/`date_to` filter
        `kpi_daily.date` (stay days), not arrivals: the summary
        (`getKpiSummary`) is an arrival cohort on `bookings.arrival_date`,
        so summary and daily totals differ at range edges **by design** —
        stays crossing date_to contribute all their nights to the summary,
        but their spill days fall outside the daily window.
        `occupancy` is a 0-1 ratio against **assumed capacity**
        (190 / 230 rooms), not a percentage and not measured. `adr` is null
        on zero-activity days.
        With `property_id` omitted or null, ONE row per date aggregates
        both properties: room_nights and revenue are summed; occupancy and
        revenue_per_available_room are computed against the combined
        capacity of 420 rooms; adr = summed revenue / summed room_nights,
        null when room_nights is zero.
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated daily series, ordered by date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDailyPage"
              example:
                data:
                  - date: "2016-01-10"
                    room_nights: 42
                    revenue: 2625.00
                    occupancy: 0.2211
                    adr: 62.50
                    revenue_per_available_room: 13.82
                  - date: "2016-01-11"
                    room_nights: 38
                    revenue: 2280.00
                    occupancy: 0.2000
                    adr: 60.00
                    revenue_per_available_room: 12.00
                  - date: "2016-01-12"
                    room_nights: 0
                    revenue: 0.00
                    occupancy: 0.0000
                    adr: null
                    revenue_per_available_room: 0.00
                meta:
                  page: 1
                  page_size: 50
                  total: 793
                  total_pages: 16
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/kpis/channels:
    get:
      operationId: getKpiChannels
      tags: [kpis]
      summary: Channel mix by market segment
      description: |
        Bookings, revenue and share per `market_segment` (the 8 CSV values).
        `agent`/`company` are unmapped numeric IDs: no named-OTA breakdown is
        possible. The example splits the full-dataset baseline across the 8
        segments (illustrative split; totals match the baseline exactly).
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: One item per market segment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelMixList"
              example:
                data:
                  - market_segment: Online TA
                    bookings: 34910
                    revenue: 12680450.20
                    share: 0.5651
                  - market_segment: Offline TA/TO
                    bookings: 10125
                    revenue: 3785120.45
                    share: 0.1639
                  - market_segment: Direct
                    bookings: 8560
                    revenue: 3120340.10
                    share: 0.1386
                  - market_segment: Groups
                    bookings: 5390
                    revenue: 1890230.38
                    share: 0.0872
                  - market_segment: Corporate
                    bookings: 2432
                    revenue: 1305420.00
                    share: 0.0394
                  - market_segment: Complementary
                    bookings: 320
                    revenue: 130250.00
                    share: 0.0052
                  - market_segment: Aviation
                    bookings: 38
                    revenue: 64100.00
                    share: 0.0006
                  - market_segment: Undefined
                    bookings: 2
                    revenue: 1049.00
                    share: 0.0000
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/kpis/seasonality:
    get:
      operationId: getKpiSeasonality
      tags: [kpis]
      summary: Month-of-year averages (seasonality)
      description: |
        Averages per month-of-year (1-12), never raw monthly totals: 2015 and
        2017 are partial years and raw totals mislead. `avg_occupancy` is a
        0-1 ratio against **assumed capacity** (190 / 230 rooms), not
        measured. Example values are illustrative monthly averages.
        With `property_id` omitted or null, daily room_nights and revenue
        are summed across both properties per date (as in `getKpiDaily`):
        `avg_occupancy` is computed against the combined capacity of 420
        rooms, and `avg_revenue` is the average of the summed daily revenue
        divided by 2 (per-property average).
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Twelve points, one per month-of-year.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonalityList"
              example:
                data:
                  - month: 1
                    avg_adr: 72.40
                    avg_occupancy: 0.4120
                    avg_revenue: 6264.05
                  - month: 2
                    avg_adr: 74.10
                    avg_occupancy: 0.4530
                    avg_revenue: 7049.13
                  - month: 3
                    avg_adr: 82.30
                    avg_occupancy: 0.5210
                    avg_revenue: 9004.44
                  - month: 4
                    avg_adr: 95.60
                    avg_occupancy: 0.6140
                    avg_revenue: 12326.66
                  - month: 5
                    avg_adr: 104.80
                    avg_occupancy: 0.6620
                    avg_revenue: 14569.30
                  - month: 6
                    avg_adr: 118.50
                    avg_occupancy: 0.7180
                    avg_revenue: 17867.43
                  - month: 7
                    avg_adr: 132.90
                    avg_occupancy: 0.7860
                    avg_revenue: 21936.47
                  - month: 8
                    avg_adr: 141.20
                    avg_occupancy: 0.8340
                    avg_revenue: 24729.77
                  - month: 9
                    avg_adr: 108.70
                    avg_occupancy: 0.6890
                    avg_revenue: 15727.80
                  - month: 10
                    avg_adr: 92.40
                    avg_occupancy: 0.6030
                    avg_revenue: 11700.61
                  - month: 11
                    avg_adr: 76.80
                    avg_occupancy: 0.4680
                    avg_revenue: 7547.90
                  - month: 12
                    avg_adr: 84.50
                    avg_occupancy: 0.5120
                    avg_revenue: 9085.44
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/reviews/summary:
    get:
      operationId: getReviewSummary
      tags: [reviews]
      summary: Reputation summary from TripAdvisor reviews
      description: |
        Averages of the real guest scores (overall + five dimensions, 1-5)
        from the TripAdvisor corpus. These are real guest scores used as weak
        labels, **not model output**. The reviews ↔ bookings link is
        **asserted at property level**, not factual: reputation KPIs come
        only from reviews, never joined to individual bookings.
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Review counts and average scores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummary"
              examples:
                bubyLago:
                  summary: Buby Lago (property 1)
                  value:
                    property_id: 1
                    count: 762
                    overall: 3.86
                    cleanliness: 4.02
                    value: 3.71
                    location: 4.35
                    rooms: 3.68
                    sleep_quality: 3.55
                bubyMontagna:
                  summary: Buby Montagna (property 2)
                  value:
                    property_id: 2
                    count: 876
                    overall: 4.40
                    cleanliness: 4.51
                    value: 4.28
                    location: 4.62
                    rooms: 4.31
                    sleep_quality: 4.22
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: Raw TripAdvisor reviews (paginated)
      description: |
        Real public TripAdvisor reviews, linked to a property by an
        **asserted** mapping (no FK to bookings, ADR 0003 §3). Scores are
        real guest scores (weak labels). No `sentiment`/`topics` fields:
        those are model output (D14) and live in a derived table, never in
        the source contract.
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated reviews, newest first by post_date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
              example:
                data:
                  - id: 1
                    property_id: 1
                    ta_hotel_id: 93618
                    post_date: "2012-05-14"
                    stay_year: 2012
                    overall: 4.0
                    cleanliness: 4.0
                    value: 4.0
                    location: 5.0
                    rooms: 4.0
                    sleep_quality: 4.0
                    title: Lovely lakeside stay
                    body: >-
                      Great location right by the water. Staff were
                      friendly and breakfast had plenty of choice.
                      Rooms are a bit dated but clean.
                    lang: __label__en
                meta:
                  page: 1
                  page_size: 50
                  total: 762
                  total_pages: 16
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: Search/filter bookings (paginated, D19)
      description: |
        One row per deduplicated CSV booking (canceled and non-canceled).
        `nights` is the Postgres-generated sum of weekend + week nights.
        `country` is a 3-letter code, not PII.
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/IsCanceled"
        - $ref: "#/components/parameters/MarketSegment"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated bookings, ordered by arrival_date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPage"
              example:
                data:
                  - id: 1
                    property_id: 1
                    arrival_date: "2015-07-01"
                    nights: 4
                    adr: 104.50
                    is_canceled: false
                    adults: 2
                    children: 0
                    babies: 0
                    country: PRT
                    customer_type: Transient
                    market_segment: Direct
                    distribution_channel: Direct
                    deposit_type: No Deposit
                    lead_time: 74
                meta:
                  page: 1
                  page_size: 50
                  total: 87396
                  total_pages: 1748
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/guest-requests:
    get:
      operationId: listGuestRequests
      tags: [guest-requests]
      summary: Guest-request inbox (paginated, D20)
      description: |
        **Synthetic** guest emails (generator DA-3), not real correspondence.
        `category` and `draft_reply` are assistant OUTPUT: null until the
        classifier + LLM draft reply land (D15). A human always approves
        before anything is sent.
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/RequestStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated guest requests, newest first by received_at.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestRequestPage"
              example:
                data:
                  - id: 1
                    property_id: 1
                    received_at: "2017-08-12T09:24:00Z"
                    body: >-
                      Hello, do you have a double room available for
                      the weekend of August 25th? We would also need a
                      parking space. Thank you!
                    category: null
                    draft_reply: null
                    status: new
                meta:
                  page: 1
                  page_size: 50
                  total: 800
                  total_pages: 16
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/guest-requests/{id}:
    patch:
      operationId: updateGuestRequest
      tags: [guest-requests]
      summary: Approve / edit / send a guest-request reply (human-in-the-loop)
      description: |
        Updates the status and/or the draft reply of a synthetic guest
        request. The assistant proposes; a human approves, edits and sends
        (D20). Sending (`status: sent`) never happens without this explicit
        human action.
      parameters:
        - $ref: "#/components/parameters/GuestRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestRequestUpdate"
            example:
              status: draft
              draft_reply: >-
                Dear guest, thank you for your message. A double room
                is available for the weekend of August 25th and a
                parking space can be reserved. Kind regards, Buby Lago.
      responses:
        "200":
          description: The updated guest request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestRequest"
              example:
                id: 1
                property_id: 1
                received_at: "2017-08-12T09:24:00Z"
                body: >-
                  Hello, do you have a double room available for the
                  weekend of August 25th? We would also need a parking
                  space. Thank you!
                category: null
                draft_reply: >-
                  Dear guest, thank you for your message. A double room
                  is available for the weekend of August 25th and a
                  parking space can be reserved. Kind regards,
                  Buby Lago.
                status: draft
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for a JWT
      description: |
        Returns a JWT bearer token and the caller's role (`admin`, `manager`
        or `property_manager`, ADR 0001). Only the scheme is frozen at SAL 1;
        real JWT issuance and role enforcement are implemented in D11.
        Unauthenticated by definition. The example token is illustrative.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: manager@buby.travel
              password: demo-password
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.\
                  eyJzdWIiOiJtYW5hZ2VyQGJ1YnkudHJhdmVsIiwicm9sZSI6\
                  Im1hbmFnZXIiLCJleHAiOjE3OTUyMzQwMDB9.\
                  k3Qb8Xw2Zr7Yc1Vn9TdLm5Hs0PfJaU6EgOi4RxKvC2w"
                token_type: bearer
                role: manager
        "401":
          description: Bad credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: invalid_credentials
                  message: Email or password is incorrect.
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by POST /api/auth/login. Roles: `admin`, `manager`,
        `property_manager` (ADR 0001). Implementation is D11; only the
        scheme is frozen at SAL 1.
  parameters:
    PropertyId:
      name: property_id
      in: query
      required: false
      description: |
        Filter by property: 1 = Buby Lago, 2 = Buby Montagna. Omitted or
        null = both properties.
      schema:
        type: integer
        nullable: true
        enum: [1, 2, null]
      example: 1
    DateFrom:
      name: date_from
      in: query
      required: false
      description: >-
        Inclusive lower bound on arrival_date. Omitted = dataset start
        (2015-07-01). For getKpiDaily the bounds filter kpi_daily.date
        (stay days) instead.
      schema:
        type: string
        format: date
      example: "2015-07-01"
    DateTo:
      name: date_to
      in: query
      required: false
      description: >-
        Inclusive upper bound on arrival_date. Omitted = dataset end
        (2017-08-31). For getKpiDaily the bounds filter kpi_daily.date
        (stay days) instead.
      schema:
        type: string
        format: date
      example: "2017-08-31"
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Items per page (max 200).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IsCanceled:
      name: is_canceled
      in: query
      required: false
      description: Filter by cancellation flag. Omitted = both.
      schema:
        type: boolean
    MarketSegment:
      name: market_segment
      in: query
      required: false
      description: |
        Filter by market segment. The 8 CSV values: Aviation, Complementary,
        Corporate, Direct, Groups, Offline TA/TO, Online TA, Undefined.
      schema:
        type: string
      example: Online TA
    RequestStatus:
      name: status
      in: query
      required: false
      description: Filter the inbox by status. Omitted = all.
      schema:
        type: string
        enum: [new, draft, sent]
    GuestRequestId:
      name: id
      in: path
      required: true
      description: Guest-request id.
      schema:
        type: integer
        minimum: 1
      example: 1
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: Missing or invalid bearer token.
    Forbidden:
      description: >-
        Authenticated, but the caller's role may not perform this action
        (enforcement lands with D11).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: forbidden
              message: Your role is not allowed to perform this action.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: Resource not found.
    ValidationError:
      description: Query parameters or request body failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_error
              message: Request parameters or body failed validation.
              details:
                page_size: Must be between 1 and 200.
  schemas:
    Error:
      type: object
      description: Error envelope used by every 4xx/5xx response.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code.
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              nullable: true
              additionalProperties: true
              description: Optional per-field or contextual details.
    PaginationMeta:
      type: object
      description: Pagination metadata returned by every list endpoint.
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          minimum: 0
          description: Total items matching the filters, across all pages.
        total_pages:
          type: integer
          minimum: 0
    Property:
      type: object
      description: |
        A fictional Buby property: 1:1 map of the CSV's two hotel types
        (Resort Hotel → Buby Lago, City Hotel → Buby Montagna).
      required: [id, name, hotel_type, location_type, room_count, ta_hotel_id]
      properties:
        id:
          type: integer
        name:
          type: string
        hotel_type:
          type: string
          description: Value of the CSV `hotel` column. Not unique.
        location_type:
          type: string
          enum: [lake, mountain]
        room_count:
          type: integer
          description: |
            ASSUMED capacity, not measured: Buby Lago 190, Buby Montagna 230
            (observed peak + margin, data dictionary Assunzione 3).
        ta_hotel_id:
          type: integer
          nullable: true
          description: >-
            TripAdvisor hotel id chosen by DA-2. Null until chosen;
            never changed after SAL 1.
    PropertyList:
      type: object
      description: Unpaginated list — exactly two properties.
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Property"
          minItems: 2
          maxItems: 2
    KpiSummary:
      type: object
      description: |
        Headline KPIs per docs/data-dictionary.md §3. The example is the
        full-dataset clean baseline (post exact dedup, filter
        is_canceled=0 AND nights>0 AND adr>0): any endpoint that does not
        reproduce it on the full dataset is wrong. occupancy_avg and revpar
        in the example are derived against assumed capacity
        (420 rooms × 793 days, 2015-07-01 → 2017-08-31).
      required:
        - property_id
        - date_from
        - date_to
        - valid_bookings
        - revenue
        - room_nights
        - adr
        - cancellation_rate
        - occupancy_avg
        - revpar
      properties:
        property_id:
          type: integer
          nullable: true
          enum: [1, 2, null]
          description: 1 = Buby Lago, 2 = Buby Montagna, null = both.
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        valid_bookings:
          type: integer
          description: Non-canceled, nights>0, adr>0, post-dedup.
        revenue:
          type: number
          description: Realized revenue = sum(adr × nights) over valid bookings.
        room_nights:
          type: integer
          description: Sum of nights over valid bookings.
        adr:
          type: number
          description: revenue / room_nights (adr>0 only).
        cancellation_rate:
          type: number
          description: >-
            Canceled / total, post-dedup, 0-1 ratio. No-Show reported
            separately.
        occupancy_avg:
          type: number
          description: |
            Σroom_nights / (Σroom_count × days-in-window): pooled over the
            window, NOT the mean of daily occupancy ratios. days-in-window
            = number of distinct dates in the requested window (793 for the
            default full window); Σroom_count = 190 or 230 per property,
            420 for both. 0-1 ratio against ASSUMED capacity — never
            measured.
        revpar:
          type: number
          description: |
            revenue / room_count / available-days, against ASSUMED capacity
            (190 / 230 rooms) — never measured.
      example:
        property_id: null
        date_from: "2015-07-01"
        date_to: "2017-08-31"
        valid_bookings: 61777
        revenue: 22976960.13
        room_nights: 218410
        adr: 105.20
        cancellation_rate: 0.2749
        occupancy_avg: 0.6558
        revpar: 68.99
    KpiDailyPoint:
      type: object
      description: |
        One day of kpi_daily for one property. With property_id omitted or
        null, one row per date sums both properties: room_nights and
        revenue added; occupancy and revenue_per_available_room against
        the combined capacity of 420 rooms; adr = summed revenue / summed
        room_nights, null when zero.
      required:
        - date
        - room_nights
        - revenue
        - occupancy
        - adr
        - revenue_per_available_room
      properties:
        date:
          type: string
          format: date
        room_nights:
          type: integer
          description: Room-nights sold that day (non-canceled bookings).
        revenue:
          type: number
          description: adr × nights, non-canceled only.
        occupancy:
          type: number
          description: |
            room_nights / room_count — 0-1 ratio (no ×100) against ASSUMED
            capacity (190 / 230 rooms; 420 when both properties are
            aggregated), not measured.
        adr:
          type: number
          nullable: true
          description: revenue / room_nights; null on zero-activity days.
        revenue_per_available_room:
          type: number
          description: >-
            revenue / room_count (ASSUMED capacity, not measured; 420 when
            both properties are aggregated).
    KpiDailyPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/KpiDailyPoint"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ChannelMixItem:
      type: object
      description: |
        Aggregates per market_segment (8 CSV values). No named-OTA
        breakdown: agent/company are unmapped numeric IDs.
      required: [market_segment, bookings, revenue, share]
      properties:
        market_segment:
          type: string
        bookings:
          type: integer
          description: Valid bookings in the segment.
        revenue:
          type: number
          description: Realized revenue in the segment.
        share:
          type: number
          description: Fraction of valid bookings in the segment (0-1, rounded).
    ChannelMixList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChannelMixItem"
    SeasonalityPoint:
      type: object
      description: |
        Averages per month-of-year (never raw monthly totals: 2015 and 2017
        are partial years).
      required: [month, avg_adr, avg_occupancy, avg_revenue]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        avg_adr:
          type: number
          description: >-
            Pooled ADR = Σ(adr × nights) / Σnights over valid bookings
            (is_canceled=0 AND nights>0 AND adr>0, post-dedup) with
            arrival_date in this month-of-year — NOT a simple mean of row
            adr values.
        avg_occupancy:
          type: number
          description: |
            Average daily occupancy in this month-of-year, 0-1 ratio against
            ASSUMED capacity (190 / 230 rooms; 420 when both properties are
            aggregated) — not measured.
        avg_revenue:
          type: number
          description: >-
            Average realized daily revenue per property in this
            month-of-year.
    SeasonalityList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SeasonalityPoint"
          minItems: 12
          maxItems: 12
    ReviewSummary:
      type: object
      description: |
        Reputation KPIs from the TripAdvisor corpus ONLY. The link to
        bookings is ASSERTED at property level, not factual. Scores are real
        guest scores (1-5, one decimal) used as weak labels — not model
        output.
      required:
        - property_id
        - count
        - overall
        - cleanliness
        - value
        - location
        - rooms
        - sleep_quality
      properties:
        property_id:
          type: integer
          nullable: true
          enum: [1, 2, null]
          description: 1 = Buby Lago, 2 = Buby Montagna, null = both.
        count:
          type: integer
          description: Number of reviews.
        overall:
          type: number
          minimum: 1
          maximum: 5
        cleanliness:
          type: number
          minimum: 1
          maximum: 5
        value:
          type: number
          minimum: 1
          maximum: 5
        location:
          type: number
          minimum: 1
          maximum: 5
        rooms:
          type: number
          minimum: 1
          maximum: 5
        sleep_quality:
          type: number
          minimum: 1
          maximum: 5
    Review:
      type: object
      description: |
        A real public TripAdvisor review. property_id is an ASSERTED
        mapping (no FK to bookings). NO sentiment/topics fields: model
        output lives in a derived table (ADR 0003 §3, D14).
      required:
        - id
        - property_id
        - ta_hotel_id
        - post_date
        - stay_year
        - overall
        - cleanliness
        - value
        - location
        - rooms
        - sleep_quality
        - title
        - body
        - lang
      properties:
        id:
          type: integer
        property_id:
          type: integer
          enum: [1, 2]
        ta_hotel_id:
          type: integer
          description: Denormalized TripAdvisor hotel id of the source row.
        post_date:
          type: string
          format: date
        stay_year:
          type: integer
          nullable: true
          description: Year only — not enough for a monthly trend.
        overall:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
        cleanliness:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
        value:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
        location:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
        rooms:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
        sleep_quality:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
          description: Review text — input of the NLP pipeline (D14).
        lang:
          type: string
          nullable: true
          description: Corpus language label, e.g. __label__en.
    ReviewPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    Booking:
      type: object
      description: One deduplicated CSV booking (canceled or not).
      required:
        - id
        - property_id
        - arrival_date
        - nights
        - adr
        - is_canceled
        - adults
        - children
        - babies
        - country
        - customer_type
        - market_segment
        - distribution_channel
        - deposit_type
        - lead_time
      properties:
        id:
          type: integer
        property_id:
          type: integer
          enum: [1, 2]
        arrival_date:
          type: string
          format: date
        nights:
          type: integer
          description: Generated by Postgres — weekend + week nights.
        adr:
          type: number
          description: Average daily rate per night.
        is_canceled:
          type: boolean
        adults:
          type: integer
        children:
          type: integer
        babies:
          type: integer
        country:
          type: string
          nullable: true
          description: 3-letter country code, not PII.
        customer_type:
          type: string
        market_segment:
          type: string
          description: One of the 8 CSV market segments.
        distribution_channel:
          type: string
        deposit_type:
          type: string
        lead_time:
          type: integer
          description: Days between booking and arrival.
    BookingPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    GuestRequest:
      type: object
      description: |
        A SYNTHETIC guest email (generator DA-3) — not real correspondence.
        category and draft_reply are assistant OUTPUT (D15): null until the
        classifier/LLM runs. A human approves before send (D20).
      required:
        - id
        - property_id
        - received_at
        - body
        - category
        - draft_reply
        - status
      properties:
        id:
          type: integer
        property_id:
          type: integer
          enum: [1, 2]
        received_at:
          type: string
          format: date-time
        body:
          type: string
          description: Synthetic email text.
        category:
          type: string
          nullable: true
          description: |
            Assistant output (null until D15). One of 6 categories:
            availability, cancellation, complaint, special_request,
            billing, info.
        draft_reply:
          type: string
          nullable: true
          description: Assistant-drafted reply (null until D15); human-editable.
        status:
          type: string
          enum: [new, draft, sent]
    GuestRequestPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GuestRequest"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    GuestRequestUpdate:
      type: object
      description: Partial update — send at least one of status / draft_reply.
      minProperties: 1
      properties:
        status:
          type: string
          enum: [new, draft, sent]
        draft_reply:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      description: >-
        JWT issuance is implemented in D11; only the shape is frozen
        here.
      required: [access_token, token_type, role]
      properties:
        access_token:
          type: string
          description: JWT bearer token.
        token_type:
          type: string
          enum: [bearer]
        role:
          type: string
          enum: [admin, manager, property_manager]
          description: Role per ADR 0001.
