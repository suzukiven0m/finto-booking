# D18 (WP14): serve la SPA e proxya /api al service api del compose.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # proxy_pass senza slash finale: il prefisso /api resta nel path inoltrato
    # (le route del backend sono /api/*).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback: le route client-side tornano index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}