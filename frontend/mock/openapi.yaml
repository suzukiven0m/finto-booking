openapi: 3.0.3
info:
  title: Buby Travel API
  version: 1.0.0
  description: |
    Pinned API contract v1 for the SAL 1 demo (D6 Prism mock copy).

    This file mirrors the canonical root `openapi.yaml` (authored by D5); field
    names, types and baseline examples are binding and must stay in sync at
    integration.

    Disclosures (freeze checklist, docs/data-dictionary.md §1):
    - Occupancy and RevPAR use ASSUMED capacity (Buby Lago 190 rooms, Buby
      Montagna 230 rooms), inferred from observed peaks — never measured.
    - The reviews↔bookings link is ASSERTED at property level, not factual.
      Occupancy/revenue KPIs come only from bookings; reputation KPIs only from
      reviews.
    - guest_requests emails are SYNTHETIC. The two properties are fictional (1:1
      map of the CSV's Resort Hotel / City Hotel types).

    KPI rules and clean baseline: docs/data-dictionary.md §3.
servers:
  - url: http://localhost:8000
    description: Real FastAPI backend (D12)
  - url: http://localhost:4010
    description: Prism mock server (D6)
security:
  - bearerAuth: []
tags:
  - name: properties
    description: >-
      The two fictional Buby properties (assumed capacity, not measured).
  - name: kpis
    description: >-
      KPIs computed from bookings only. Occupancy/RevPAR use assumed capacity.
  - name: reviews
    description: >-
      TripAdvisor reputation KPIs. Link to bookings is asserted at property
      level, not factual.
  - name: bookings
    description: >-
      Booking search (D19). Real CSV data, deduplicated on the original columns.
  - name: guest-requests
    description: >-
      Synthetic guest emails (D20 inbox). category/draft_reply are assistant
      output (null until D15).
  - name: auth
    description: JWT login. Scheme frozen here; real issuance is D11.

paths:
  /api/properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: >-
        List the two fictional properties (1:1 map of the CSV's hotel types).
      description: |
        Exactly two properties. room_count is ASSUMED capacity (190/230), not
        measured.
        No pagination. Open for the demo (no auth required).
      security: []
      responses:
        "200":
          description: The two properties.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyList"
              example:
                data:
                  - id: 1
                    name: Buby Lago
                    hotel_type: Resort Hotel
                    location_type: lake
                    room_count: 190
                    ta_hotel_id: 93618
                  - id: 2
                    name: Buby Montagna
                    hotel_type: City Hotel
                    location_type: mountain
                    room_count: 230
                    ta_hotel_id: 2079052

  /api/kpis/summary:
    get:
      operationId: getKpiSummary
      tags: [kpis]
      summary: Headline KPIs over the selected property and date range.
      description: |
        Rules (docs/data-dictionary.md §3): revenue = adr × nights over
        is_canceled=0 AND nights>0 AND adr>0; cancellation_rate = canceled/total
        post-dedup (No-Show reported separately); adr = revenue/room_nights;
        occupancy_avg = mean(room_nights/room_count); revpar =
        revenue/room_count/available-days.
        occupancy_avg and revpar use ASSUMED capacity (Buby Lago 190, Buby
        Montagna 230), never measured. The example is the full-dataset clean
        baseline (2015-07-01 → 2017-08-31, both properties);
        occupancy_avg/revpar in the example are derived from that baseline
        against the assumed capacity (420 rooms × 793 days).
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: KPI summary (example = full-dataset clean baseline).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiSummary"
              example:
                property_id: null
                date_from: "2015-07-01"
                date_to: "2017-08-31"
                valid_bookings: 61777
                revenue: 22976960.13
                room_nights: 218410
                adr: 105.20
                cancellation_rate: 0.2749
                occupancy_avg: 0.6558
                revpar: 68.99
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/kpis/daily:
    get:
      operationId: getKpiDaily
      tags: [kpis]
      summary: Daily KPI time series (occupancy, revenue, ADR, RevPAR per day).
      description: |
        One point per day. occupancy is a 0-1 ratio against ASSUMED capacity
        (190/230 rooms), not measured. adr is null on zero-activity days.
        The example series is Buby Lago (190 rooms), November 2016.
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated daily KPI points.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KpiDailyPage"
              example:
                data:
                  - date: "2016-11-02"
                    room_nights: 96
                    revenue: 7910.40
                    occupancy: 0.5053
                    adr: 82.40
                    revenue_per_available_room: 41.63
                  - date: "2016-11-03"
                    room_nights: 88
                    revenue: 7031.20
                    occupancy: 0.4632
                    adr: 79.90
                    revenue_per_available_room: 37.01
                  - date: "2016-11-04"
                    room_nights: 0
                    revenue: 0.00
                    occupancy: 0.0000
                    adr: null
                    revenue_per_available_room: 0.00
                  - date: "2016-11-05"
                    room_nights: 104
                    revenue: 8850.40
                    occupancy: 0.5474
                    adr: 85.10
                    revenue_per_available_room: 46.58
                  - date: "2016-11-06"
                    room_nights: 121
                    revenue: 10684.30
                    occupancy: 0.6368
                    adr: 88.30
                    revenue_per_available_room: 56.23
                meta:
                  page: 1
                  page_size: 50
                  total: 793
                  total_pages: 16
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/kpis/channels:
    get:
      operationId: getKpiChannels
      tags: [kpis]
      summary: Channel mix by market_segment (8 values).
      description: |
        agent/company are unmapped numeric IDs: no named-OTA breakdown is
        possible.
        Example shares/revenues sum to the clean baseline (61,777 valid
        bookings, €22,976,960.13 realized revenue).
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Channel mix items (one per market_segment).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelMixList"
              example:
                data:
                  - market_segment: Online TA
                    bookings: 24862
                    revenue: 9874512.30
                    share: 0.4025
                  - market_segment: Offline TA/TO
                    bookings: 10228
                    revenue: 4520311.85
                    share: 0.1656
                  - market_segment: Direct
                    bookings: 9316
                    revenue: 3410988.20
                    share: 0.1508
                  - market_segment: Groups
                    bookings: 8712
                    revenue: 2688450.10
                    share: 0.1410
                  - market_segment: Corporate
                    bookings: 6394
                    revenue: 1899210.45
                    share: 0.1035
                  - market_segment: Complementary
                    bookings: 1804
                    revenue: 120344.63
                    share: 0.0292
                  - market_segment: Aviation
                    bookings: 385
                    revenue: 462110.60
                    share: 0.0062
                  - market_segment: Undefined
                    bookings: 76
                    revenue: 1032.00
                    share: 0.0012
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/kpis/seasonality:
    get:
      operationId: getKpiSeasonality
      tags: [kpis]
      summary: Month-of-year averages (never raw monthly totals).
      description: |
        Averages per month-of-year across 2015–2017; 2015 and 2017 are partial
        years, so raw monthly totals would mislead. avg_occupancy uses ASSUMED
        capacity.
        Example values are illustrative (both properties, 420 assumed rooms).
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Twelve month-of-year points.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonalityList"
              example:
                data:
                  - month: 1
                    avg_adr: 76.40
                    avg_occupancy: 0.4120
                    avg_revenue: 13204.80
                  - month: 2
                    avg_adr: 78.10
                    avg_occupancy: 0.4480
                    avg_revenue: 14718.50
                  - month: 3
                    avg_adr: 84.60
                    avg_occupancy: 0.5230
                    avg_revenue: 18590.20
                  - month: 4
                    avg_adr: 92.30
                    avg_occupancy: 0.6010
                    avg_revenue: 23288.40
                  - month: 5
                    avg_adr: 99.80
                    avg_occupancy: 0.6640
                    avg_revenue: 27877.10
                  - month: 6
                    avg_adr: 112.50
                    avg_occupancy: 0.7420
                    avg_revenue: 35028.60
                  - month: 7
                    avg_adr: 128.90
                    avg_occupancy: 0.8360
                    avg_revenue: 45231.70
                  - month: 8
                    avg_adr: 134.20
                    avg_occupancy: 0.8710
                    avg_revenue: 49094.30
                  - month: 9
                    avg_adr: 108.70
                    avg_occupancy: 0.7180
                    avg_revenue: 32750.90
                  - month: 10
                    avg_adr: 93.40
                    avg_occupancy: 0.6120
                    avg_revenue: 24018.20
                  - month: 11
                    avg_adr: 80.20
                    avg_occupancy: 0.4890
                    avg_revenue: 16470.50
                  - month: 12
                    avg_adr: 82.90
                    avg_occupancy: 0.5060
                    avg_revenue: 17622.40
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/reviews/summary:
    get:
      operationId: getReviewSummary
      tags: [reviews]
      summary: Reputation summary from TripAdvisor reviews only.
      description: |
        Scores are real guest scores (1–5, weak labels), not model output.
        The reviews↔bookings link is ASSERTED at property level, not factual:
        reputation KPIs come only from reviews, never joined to individual
        bookings.
        property_id=null aggregates both properties.
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Review summary (default example = Buby Lago).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSummary"
              examples:
                lago:
                  summary: Buby Lago (property 1)
                  value:
                    property_id: 1
                    count: 762
                    overall: 3.86
                    cleanliness: 4.12
                    value: 3.71
                    location: 4.55
                    rooms: 3.80
                    sleep_quality: 3.92
                montagna:
                  summary: Buby Montagna (property 2)
                  value:
                    property_id: 2
                    count: 876
                    overall: 4.40
                    cleanliness: 4.51
                    value: 4.28
                    location: 4.62
                    rooms: 4.35
                    sleep_quality: 4.41
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: Paginated TripAdvisor reviews (real guest text and scores).
      description: |
        No sentiment/topics fields: those are model output (ADR 0003 §3) and
        live in a derived table, never on the source rows. Link to bookings is
        asserted at property level only.
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated reviews.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
              example:
                data:
                  - id: 1
                    property_id: 1
                    ta_hotel_id: 93618
                    post_date: "2012-05-14"
                    stay_year: 2012
                    overall: 4.0
                    cleanliness: 5.0
                    value: 4.0
                    location: 5.0
                    rooms: 4.0
                    sleep_quality: 4.0
                    title: Lovely lakeside resort
                    body: >-
                      Great location right on the lake. Staff were friendly and
                      the breakfast buffet had plenty of choice. Rooms are a bit
                      dated but clean.
                    lang: __label__en
                  - id: 2
                    property_id: 1
                    ta_hotel_id: 93618
                    post_date: "2012-06-02"
                    stay_year: 2011
                    overall: 3.0
                    cleanliness: 4.0
                    value: 3.0
                    location: 5.0
                    rooms: 3.0
                    sleep_quality: null
                    title: Nice view, thin walls
                    body: >-
                      The view from the balcony is stunning but we could hear
                      the neighbours every night. Reception handled our room
                      change politely.
                    lang: __label__en
                meta:
                  page: 1
                  page_size: 50
                  total: 762
                  total_pages: 16
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: Booking search with filters (D19).
      description: |
        Real hotel_bookings.csv rows, deduplicated on the original columns.
        nights is generated (weekend + week nights). is_canceled rows are
        included and filterable.
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/IsCanceled"
        - $ref: "#/components/parameters/MarketSegment"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated bookings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPage"
              example:
                data:
                  - id: 1
                    property_id: 1
                    arrival_date: "2015-07-01"
                    nights: 3
                    adr: 98.50
                    is_canceled: false
                    adults: 2
                    children: 0
                    babies: 0
                    country: PRT
                    customer_type: Transient
                    market_segment: Direct
                    distribution_channel: Direct
                    deposit_type: No Deposit
                    lead_time: 34
                  - id: 2
                    property_id: 2
                    arrival_date: "2015-07-01"
                    nights: 2
                    adr: 105.00
                    is_canceled: true
                    adults: 2
                    children: 0
                    babies: 0
                    country: GBR
                    customer_type: Transient
                    market_segment: Online TA
                    distribution_channel: TA/TO
                    deposit_type: Non Refund
                    lead_time: 112
                meta:
                  page: 1
                  page_size: 50
                  total: 87396
                  total_pages: 1748
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/guest-requests:
    get:
      operationId: listGuestRequests
      tags: [guest-requests]
      summary: Guest-request inbox (D20). Emails are SYNTHETIC.
      description: |
        Synthetic guest emails (DA-3). category and draft_reply are assistant
        OUTPUT and stay null until D15.
        true_category/true_urgency never appear here (anti-leakage,
        docs/delivery-plan.md).
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/RequestStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated guest requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestRequestPage"
              example:
                data:
                  - id: 1
                    property_id: 1
                    received_at: "2017-08-12T09:24:00Z"
                    body: >-
                      Hello, do you have a double room with lake view available
                      from August 20 to August 24? We are celebrating our
                      anniversary. Kind regards, Marta
                    category: null
                    draft_reply: null
                    status: new
                  - id: 2
                    property_id: 2
                    received_at: "2017-08-12T14:02:00Z"
                    body: >-
                      I need to cancel my reservation for September 3 due to a
                      family emergency. Is the deposit refundable? Thank you,
                      João
                    category: null
                    draft_reply: null
                    status: new
                meta:
                  page: 1
                  page_size: 50
                  total: 800
                  total_pages: 16
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/guest-requests/{id}:
    patch:
      operationId: updateGuestRequest
      tags: [guest-requests]
      summary: Approve/edit/send a guest-request reply (human-in-the-loop).
      description: |
        The assistant drafts; a human approves, edits and sends. draft_reply may
        be human-edited text. Emails are synthetic.
      parameters:
        - $ref: "#/components/parameters/GuestRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestRequestUpdate"
            example:
              status: draft
              draft_reply: >-
                Dear Marta, thank you for your message. We would be delighted to
                host your anniversary stay. A double room with lake view is
                available from August 20 to 24. Best regards, Buby Lago
      responses:
        "200":
          description: The updated guest request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestRequest"
              example:
                id: 1
                property_id: 1
                received_at: "2017-08-12T09:24:00Z"
                body: >-
                  Hello, do you have a double room with lake view available from
                  August 20 to August 24? We are celebrating our anniversary.
                  Kind regards, Marta
                category: null
                draft_reply: >-
                  Dear Marta, thank you for your message. We would be delighted
                  to host your anniversary stay. A double room with lake view is
                  available from August 20 to 24. Best regards, Buby Lago
                status: draft
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: >-
        Exchange credentials for a JWT (scheme frozen; real issuance is D11).
      description: |
        Roles: admin, manager, property_manager. Open endpoint (no auth
        required).
        The mock accepts any credentials and returns a static demo token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: manager@buby.travel
              password: demo
      responses:
        "200":
          description: JWT issued (demo token in the mock).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                access_token: eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoibWFuYWdlciJ9.mock
                token_type: bearer
                role: manager
        "401":
          description: Bad credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error:
                  code: invalid_credentials
                  message: Email or password is incorrect.
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT with role claim. Roles: admin (full access), manager (all
        properties), property_manager (own property only). Implementation is
        D11; only the scheme is frozen in this contract.

  parameters:
    PropertyId:
      name: property_id
      in: query
      required: false
      description: Filter by property. Omit/null = both properties.
      schema:
        type: integer
        enum: [1, 2]
    DateFrom:
      name: date_from
      in: query
      required: false
      description: Inclusive start date (arrival/stay date).
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      required: false
      description: Inclusive end date (arrival/stay date).
      schema:
        type: string
        format: date
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IsCanceled:
      name: is_canceled
      in: query
      required: false
      description: Filter by cancellation flag.
      schema:
        type: boolean
    MarketSegment:
      name: market_segment
      in: query
      required: false
      description: Filter by market segment (8 CSV values).
      schema:
        type: string
        enum:
          - Direct
          - Corporate
          - Online TA
          - Offline TA/TO
          - Groups
          - Complementary
          - Aviation
          - Undefined
    RequestStatus:
      name: status
      in: query
      required: false
      description: Filter by inbox status.
      schema:
        type: string
        enum: [new, draft, sent]
    GuestRequestId:
      name: id
      in: path
      required: true
      description: Guest request id.
      schema:
        type: integer

  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: not_found
              message: The requested resource does not exist.
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: unauthorized
              message: A valid bearer token is required.
    Forbidden:
      description: Authenticated but the role cannot access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: forbidden
              message: Your role does not allow access to this property.
    ValidationError:
      description: Query/body validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: validation_error
              message: Request validation failed.
              details:
                property_id: must be one of [1, 2]

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
        details:
          type: object
          nullable: true
          description: Optional field-level details.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    PageMeta:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 200
        total:
          type: integer
          description: Total items across all pages.
        total_pages:
          type: integer
    Property:
      type: object
      description: |
        Fictional property (1:1 map of the CSV's hotel types). room_count is
        ASSUMED capacity (Assunzione 3), not measured.
      required: [id, name, hotel_type, location_type, room_count, ta_hotel_id]
      properties:
        id:
          type: integer
        name:
          type: string
        hotel_type:
          type: string
          description: >-
            Value of the CSV `hotel` column (Resort Hotel / City Hotel).
        location_type:
          type: string
          enum: [lake, mountain]
        room_count:
          type: integer
          description: >-
            Assumed capacity, not measured (Buby Lago 190, Buby Montagna 230).
        ta_hotel_id:
          type: integer
          nullable: true
          description: TripAdvisor hotel id chosen by DA-2; null until chosen.
    PropertyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Property"
          minItems: 2
          maxItems: 2
    KpiSummary:
      type: object
      description: |
        Headline KPIs. occupancy_avg and revpar use ASSUMED capacity (190/230),
        never measured. Baseline rules in docs/data-dictionary.md §3.
      required:
        - property_id
        - date_from
        - date_to
        - valid_bookings
        - revenue
        - room_nights
        - adr
        - cancellation_rate
        - occupancy_avg
        - revpar
      properties:
        property_id:
          type: integer
          nullable: true
          description: null = both properties.
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        valid_bookings:
          type: integer
          description: >-
            Non-canceled, nights>0, adr>0, post-dedup. Baseline 61,777.
        revenue:
          type: number
          description: >-
            adr × nights over valid bookings. Baseline €22,976,960.13.
        room_nights:
          type: integer
          description: Baseline 218,410.
        adr:
          type: number
          description: revenue / room_nights. Baseline €105.20.
        cancellation_rate:
          type: number
          description: >-
            canceled/total post-dedup, No-Show excluded. Baseline 0.2749.
        occupancy_avg:
          type: number
          description: >-
            mean(room_nights/room_count), 0-1 ratio, ASSUMED capacity.
        revpar:
          type: number
          description: revenue/room_count/available-days, ASSUMED capacity.
    KpiDailyPoint:
      type: object
      description: One day of KPIs. occupancy/RevPAR against ASSUMED capacity.
      required:
        - date
        - room_nights
        - revenue
        - occupancy
        - adr
        - revenue_per_available_room
      properties:
        date:
          type: string
          format: date
        room_nights:
          type: integer
        revenue:
          type: number
        occupancy:
          type: number
          description: >-
            room_nights/room_count, 0-1 ratio (numeric 5,4), assumed capacity.
        adr:
          type: number
          nullable: true
          description: revenue/room_nights; null on zero-activity days.
        revenue_per_available_room:
          type: number
          description: revenue/room_count, assumed capacity.
    KpiDailyPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/KpiDailyPoint"
        meta:
          $ref: "#/components/schemas/PageMeta"
    ChannelMixItem:
      type: object
      required: [market_segment, bookings, revenue, share]
      properties:
        market_segment:
          type: string
          description: One of the 8 CSV market segments.
        bookings:
          type: integer
        revenue:
          type: number
        share:
          type: number
          description: Share of bookings, 0-1.
    ChannelMixList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChannelMixItem"
    SeasonalityPoint:
      type: object
      description: >-
        Month-of-year average (2015/2017 partial years; never raw totals).
      required: [month, avg_adr, avg_occupancy, avg_revenue]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        avg_adr:
          type: number
        avg_occupancy:
          type: number
          description: 0-1 ratio, ASSUMED capacity.
        avg_revenue:
          type: number
    SeasonalityList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SeasonalityPoint"
    ReviewSummary:
      type: object
      description: |
        Reputation KPIs from reviews ONLY. Real guest scores 1–5 (weak labels),
        not model output. Link to bookings asserted at property level, not
        factual.
      required:
        - property_id
        - count
        - overall
        - cleanliness
        - value
        - location
        - rooms
        - sleep_quality
      properties:
        property_id:
          type: integer
          nullable: true
          description: null = both properties.
        count:
          type: integer
        overall:
          type: number
        cleanliness:
          type: number
        value:
          type: number
        location:
          type: number
        rooms:
          type: number
        sleep_quality:
          type: number
    Review:
      type: object
      description: |
        TripAdvisor review. No sentiment/topics fields: model output lives in a
        derived table (ADR 0003 §3), never on the source row.
      required:
        - id
        - property_id
        - ta_hotel_id
        - post_date
        - stay_year
        - overall
        - cleanliness
        - value
        - location
        - rooms
        - sleep_quality
        - title
        - body
        - lang
      properties:
        id:
          type: integer
        property_id:
          type: integer
        ta_hotel_id:
          type: integer
        post_date:
          type: string
          format: date
        stay_year:
          type: integer
          nullable: true
        overall:
          type: number
          nullable: true
        cleanliness:
          type: number
          nullable: true
        value:
          type: number
          nullable: true
        location:
          type: number
          nullable: true
        rooms:
          type: number
          nullable: true
        sleep_quality:
          type: number
          nullable: true
        title:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        lang:
          type: string
          nullable: true
          description: Corpus label, e.g. __label__en.
    ReviewPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        meta:
          $ref: "#/components/schemas/PageMeta"
    Booking:
      type: object
      description: >-
        One deduplicated CSV booking row. nights = weekend + week nights.
      required:
        - id
        - property_id
        - arrival_date
        - nights
        - adr
        - is_canceled
        - adults
        - children
        - babies
        - country
        - customer_type
        - market_segment
        - distribution_channel
        - deposit_type
        - lead_time
      properties:
        id:
          type: integer
        property_id:
          type: integer
        arrival_date:
          type: string
          format: date
        nights:
          type: integer
        adr:
          type: number
        is_canceled:
          type: boolean
        adults:
          type: integer
        children:
          type: integer
        babies:
          type: integer
        country:
          type: string
          nullable: true
          description: ISO code, not personal data.
        customer_type:
          type: string
        market_segment:
          type: string
        distribution_channel:
          type: string
        deposit_type:
          type: string
        lead_time:
          type: integer
    BookingPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        meta:
          $ref: "#/components/schemas/PageMeta"
    GuestRequest:
      type: object
      description: |
        SYNTHETIC guest email. category/draft_reply are assistant OUTPUT (null
        until D15). true_category/true_urgency never appear (anti-leakage).
      required:
        - id
        - property_id
        - received_at
        - body
        - category
        - draft_reply
        - status
      properties:
        id:
          type: integer
        property_id:
          type: integer
        received_at:
          type: string
          format: date-time
        body:
          type: string
        category:
          type: string
          nullable: true
          description: Assistant output; null until D15.
        draft_reply:
          type: string
          nullable: true
          description: Assistant draft or human edit; null until D15.
        status:
          type: string
          enum: [new, draft, sent]
    GuestRequestPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GuestRequest"
        meta:
          $ref: "#/components/schemas/PageMeta"
    GuestRequestUpdate:
      type: object
      description: Human-in-the-loop approve/edit/send.
      properties:
        status:
          type: string
          enum: [new, draft, sent]
        draft_reply:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required: [access_token, token_type, role]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        role:
          type: string
          description: admin | manager | property_manager (issuance is D11).
          enum: [admin, manager, property_manager]
