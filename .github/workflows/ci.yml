name: CI

on:
  push:
    branches: [master, plumbing]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buby
          POSTGRES_PASSWORD: buby
          POSTGRES_DB: buby
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # stesso schema del docker-compose: il DB e' il service qui sopra
      DATABASE_URL: postgresql+psycopg://buby:buby@localhost:5432/buby
      # con CI impostata il conftest fallisce invece di saltare i test
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # lint pinnato: senza pin un rilascio di ruff rompe la CI
        run: pip install -r backend/requirements.txt ruff==0.17.5 isort==9.0.2

      - name: Lint
        run: |
          ruff check backend/
          isort --check-only backend/

      - name: Migrations up
        working-directory: backend
        run: alembic upgrade head

      - name: Models == migrations
        working-directory: backend
        run: alembic check

      - name: Schema tests
        working-directory: backend
        # i contract test vogliono il DB seedato: girano nel passo post-seed
        # "API tests on sample", qui si escludono per non raccoglierli a vuoto
        run: pytest -q --ignore=tests/test_contract.py

      - name: Round-trip
        working-directory: backend
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Downgrade one step
        # "downgrade base" droppa la tabella in 0002, quindi non prova che 0003
        # ripristini lo stato di 0002. Qui si controlla davvero: le tre colonne
        # che 0002 aveva NOT NULL devono tornare NOT NULL, altrimenti il
        # downgrade non e' un inverso fedele.
        working-directory: backend
        run: |
          alembic downgrade 0002
          python - <<'PY'
          import sqlalchemy as sa
          import app.config as cfg
          e = sa.create_engine(cfg.DATABASE_URL)
          cols = {c["name"]: c for c in sa.inspect(e).get_columns("reviews")}
          for nome in ("score", "text", "language"):
              assert cols[nome]["nullable"] is False, cols[nome]
          print("reviews score/text/language NOT NULL: ok")
          PY
          alembic upgrade head

      # data/ (playbook solo-dataset §7.2): seed del campione + test
      - name: Data deps
        run: pip install -r data/requirements.txt

      - name: Seed sample (bookings + KPI + reviews + emails)
        # tutti gli artefatti committati: niente pickle/CSV completo in CI
        run: |
          PYTHONPATH=backend python data/etl/load_bookings.py \
            data/raw/sample_hotel_bookings.csv
          PYTHONPATH=backend python data/etl/build_kpi_daily.py
          PYTHONPATH=backend python data/etl/load_reviews.py
          PYTHONPATH=backend python data/etl/gen_emails.py

      - name: D15 classify + persist
        # gen_emails.py ha appena rigenerato il gold nello stesso run:
        # IDs allineati. Classifica e scrive status=draft prima dei test
        # che verificano la semantica post-D15.
        run: >-
          PYTHONPATH=backend:data
          python data/etl/classify_emails.py --persist

      - name: Data tests
        run: PYTHONPATH=backend:data pytest -q data/tests

      - name: API tests on sample
        # WP8: dopo il seed il baseline campione (5000 righe) finalmente gira
        # (prima saltava sempre: gap di ordinamento seed dalla review WP3).
        # Qui girano anche i contract test: tutte le 11 operazioni validate
        # contro openapi.yaml sul DB seedato.
        run: >-
          PYTHONPATH=backend pytest -q
          backend/tests/test_api.py backend/tests/test_contract.py

      - name: E2E smoke on sample (real HTTP)
        # D17: la chain UI gira contro uvicorn vero sul DB seedato qui sopra,
        # non contro il mock. Lo script riconosce da solo il baseline campione
        # (3564 valid); DB/API irraggiungibili => exit 1, mai skip.
        working-directory: backend
        run: |
          uvicorn app.main:app --port 8000 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null' EXIT
          for _ in $(seq 1 30); do
            if curl -sf localhost:8000/api/properties >/dev/null; then
              break
            fi
            sleep 1
          done
          python tests/e2e_smoke.py

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test -- --run

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        env:
          # D17: build contro le API reali (e' anche il default del client)
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build
