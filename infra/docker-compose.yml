services:
  postgres:
    # Swap for pgvector/pgvector:pg16 only if the RAG stretch goal is built,
    # see docs/adr/0001-tech-stack.md.
    image: postgres:16
    container_name: buby-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buby}
      POSTGRES_DB: ${POSTGRES_DB:-buby}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
