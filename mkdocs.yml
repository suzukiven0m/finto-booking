site_name: Buby Travel
site_description: Documentazione del progetto di laboratorio Buby Travel
repo_url: https://github.com/suzukiven0m/finto-booking
repo_name: suzukiven0m/finto-booking
docs_dir: docs

theme:
  name: material
  language: it
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Passa al tema scuro
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Passa al tema chiaro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Per iniziare:
      - Guida per iniziare: getting-started.md
      - Glossario: glossario.md
  - Architettura:
      - Panoramica e diagramma: architettura/README.md
      - Browser: architettura/spa-react.md
      - Serving:
          - nginx proxy: architettura/nginx-proxy.md
          - API FastAPI: architettura/api-fastapi.md
          - Autenticazione e ruoli: architettura/auth-jwt-ruoli.md
          - Database PostgreSQL: architettura/database-postgres.md
          - Migrazioni Alembic: architettura/migrazioni-alembic.md
          - Docker Compose: architettura/docker-compose.md
      - Pipeline dati:
          - ETL: architettura/etl-pipeline.md
          - Classificatore email: architettura/classificatore-email.md
          - NLP recensioni: architettura/nlp-recensioni.md
          - Valutazione e anti-leakage: architettura/valutazione-anti-leakage.md
      - Contratto e CI:
          - Contratto OpenAPI: architettura/contratto-openapi.md
          - Mock e Prism: architettura/mock-prism.md
          - Contract test: architettura/contract-tests.md
          - GitHub Actions: architettura/ci-github-actions.md
      - Processo: architettura/processo-governance.md
  - Dati e API:
